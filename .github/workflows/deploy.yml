# Build and publish the app to GitHub Pages on every push to main.
# One-time setup in the GitHub repo: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allow manual re-deploys from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push cancels a queued (not yet running) one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check JavaScript
        run: |
          for f in js/*.js sw.js tools/*.mjs; do node --check "$f"; done

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js icons _site/
          # Stamp the service-worker cache name with the commit so installed copies update automatically.
          sed -i "s/^const VERSION = .*/const VERSION = 'caged-flow-${GITHUB_SHA::7}';/" _site/sw.js
          grep -q "caged-flow-${GITHUB_SHA::7}" _site/sw.js || { echo "Failed to stamp sw.js VERSION"; exit 1; }
          echo "Deploying $(find _site -type f | wc -l) files, cache version caged-flow-${GITHUB_SHA::7}"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
